# Actions
- type: entity
  id: ActionMindFlayerOpenShop
  name: Self-Augment Operations
  description: Choose how we will upgrade ourselves
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: choose_module
    event: !type:MindflayerShopActionEvent

- type: entity
  id: ActionMindFlayerSwarmprod
  name: Swarmprod
  description: We shape our arm into an extended mass of sparking nanites
  components:
  - type: InstantAction
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: swarmprod
    event: !type:RetractItemActionEvent
  - type: RetractableItemAction
  - type: ContainerContainer
    containers:
      retractable_slot: !type:ContainerSlot
  - type: ContainerFill
    containers:
      retractable_slot:
        - Swarmprod

- type: entity
  id: ActionMindFlayerQuickReboot
  name: Quick Reboot
  description: Heal and remove any incapacitating effects from ourselves
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: quick_reboot
    event: !type:MindflayerAddSolutionToBloodstreamEvent
      solution:
        reagents:
        - ReagentId: RejuvenatingNanites
          Quantity: 10

- type: entity
  id: ActionMindFlayerSiphonMind
  name: Siphon Mind
  description: Draw Mind from others so that we may use it
  components:
  - type: EntityTargetAction
    useDelay: 50
    whitelist:
      components:
      - HumanoidAppearance
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: siphon
    event: !type:MindflayerSiphonMindActionEvent

- type: entity
  id: ActionMindFlayerCamfectingBug
  name: Camfecting Bug
  description: We hack a camera such that we may see from it
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    useDelay: 50
    whitelist:
      tags:
      - SurveillanceCamera
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: camera_bug
    event: !type:MindflayerCamfectingBugEvent

- type: entity
  id: ActionMindFlayerViewCameras
  name: View Cameras
  description: See from a camera that we have hacked
  components:
  - type: InstantAction
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: camera_bug
    event: !type:MindflayerOpenHackedCamerasEvent

- type: entity
  id: ActionMindFlayerTraceroute
  name: Traceroute
  description: Allows us to record a computer's address. We can then use another computer to recall ourselves to it.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    useDelay: 60
    whitelist:
      components:
      - MindflayerTraceRouteTarget
    icon:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: pd_cablehop
    backgroundOn:
      sprite: _DV/Interface/Actions/mindflayer.rsi
      state: bg_flayer
    event: !type:MindflayerTraceRouteActionEvent
